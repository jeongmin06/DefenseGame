name: Manual review capture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-capture
  cancel-in-progress: false

jobs:
  capture:
    name: Capture and publish private review video
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      GODOT_VERSION: 4.7.2
      GODOT_APP: ${{ github.workspace }}/.dev/godot-ci/Godot_mono.app
      GH_TOKEN: ${{ secrets.REVIEW_REPOSITORY_TOKEN }}
      REVIEW_REPOSITORY: jeongmin06/DefenseGame-Docs
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v7

      - name: Require private review token
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            printf 'REVIEW_REPOSITORY_TOKEN secret is required.\n' >&2
            exit 1
          fi

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.306

      - name: Cache Godot .NET editor
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: .dev/godot-ci
          key: godot-${{ runner.os }}-4.7.2-stable-mono-macos-universal

      - name: Download Godot 4.7.2 .NET editor
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p .dev/godot-ci
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip" \
            --output "$RUNNER_TEMP/godot-mono.zip"
          ditto -x -k "$RUNNER_TEMP/godot-mono.zip" .dev/godot-ci

      - name: Install ffmpeg
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Capture smoke review
        run: ./scripts/run-dev.sh --capture

      - name: Publish to private review repository
        run: |
          capture_dir="$(find .dev/captures -mindepth 1 -maxdepth 1 -type d | LC_ALL=C sort -r | head -n 1)"
          [[ -n "$capture_dir" ]] || { printf 'Capture directory was not created.\n' >&2; exit 1; }
          ./scripts/upload-review-capture.sh "$capture_dir"
          release_url="$(cat "$capture_dir/release-url.txt")"
          printf '### Private review video\n\n[%s](%s)\n' "$release_url" "$release_url" >> "$GITHUB_STEP_SUMMARY"

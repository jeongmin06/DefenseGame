name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Server, data, and C# verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.306

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run repository CI baseline
        run: ./scripts/ci-verify.sh

  godot-import:
    name: Godot 4.7.2 .NET headless import
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      GODOT_VERSION: 4.7.2
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.306

      - name: Cache Godot .NET editor
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: .dev/godot
          key: godot-${{ runner.os }}-4.7.2-stable-mono

      - name: Download Godot 4.7.2 .NET editor
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p .dev/godot
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip" \
            --output /tmp/godot-mono.zip
          unzip -q /tmp/godot-mono.zip -d /tmp/godot-mono
          cp -R /tmp/godot-mono/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/. .dev/godot/

      - name: Import Godot project headlessly
        run: |
          chmod +x .dev/godot/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64
          .dev/godot/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 \
            --headless \
            --path godot-client \
            --import 2>&1 | tee /tmp/godot-import.log
          if grep -E '^ERROR:|SCRIPT ERROR:' /tmp/godot-import.log; then
            printf 'Godot import log contains errors.\n' >&2
            exit 1
          fi
